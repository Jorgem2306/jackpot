<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Purga - Ruleta Jackpot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Creepster&family=Montserrat:wght@400;700;900&family=Special+Elite&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="p-2 md:p-6 flex flex-col items-center justify-center min-h-screen">

    <!-- Background Characters -->
    <img src="akumafondo.png" class="animate-float fixed left-0 bottom-0 h-[50vh] sm:h-[70vh] md:h-[85vh] w-auto max-w-[35vw] object-contain object-left-bottom pointer-events-none z-0 opacity-90 drop-shadow-[0_0_15px_rgba(255,0,0,0.5)] transition-all duration-700" alt="Akuma Fondo">
    <img src="nicolefondo.png" class="animate-float-delayed fixed right-0 bottom-0 h-[50vh] sm:h-[70vh] md:h-[85vh] w-auto max-w-[35vw] object-contain object-right-bottom pointer-events-none z-0 opacity-90 drop-shadow-[0_0_15px_rgba(255,0,0,0.5)] transition-all duration-700" alt="Nicole Fondo">

    <main class="w-full max-w-4xl flex flex-col items-center gap-6 relative z-10">

        <!-- Header / Logo -->
        <div class="text-center mb-4">
            <h1
                class="font-creepster text-4xl sm:text-5xl md:text-7xl text-red-600 tracking-wider animate-flicker px-2">
                AKU & FRIENDS</h1>
            <p
                class="font-special-elite text-xs sm:text-sm md:text-2xl text-gray-300 tracking-[0.1em] md:tracking-[0.2em] mt-2 md:mt-3 drop-shadow-md px-2">
                LA PURGA: TODO SALE A LA LUZ</p>
        </div>

        <!-- Canvas Roulette Wheel -->
        <section class="w-full flex flex-col items-center p-2 md:p-4 relative">

            <!-- Canvas Container with 3D Bezel Frame -->
            <div class="relative w-full aspect-square max-w-[min(800px,70vh)] flex items-center justify-center">
                <!-- Dark Iron Outer Rim Reflection -->
                <div
                    class="absolute inset-0 rounded-full bg-gradient-to-br from-[#1a1a1a] via-[#050505] to-[#2a2a2a] shadow-[0_15px_35px_rgba(0,0,0,1),inset_0_2px_4px_rgba(255,0,0,0.2)] border border-[#330000]">
                </div>
                <!-- Brass/Red Outer Track -->
                <div
                    class="absolute inset-[0.5%] rounded-full bg-gradient-to-tr from-[#3a0000] via-[#8b0000] to-[#1a0000] shadow-inner">
                </div>

                <!-- Canvas for spinning pocket rim and ball -->
                <canvas id="rouletteCanvas" width="700" height="700"
                    class="relative z-10 w-[98.5%] h-[98.5%] rounded-full cursor-pointer"></canvas>
            </div>




        </section>
    </main>

    <!-- Result Modal Overlay -->
    <div id="resultModal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-500 p-4">
        <!-- Result text Card -->
        <div id="resultPreviewCard"
            class="flex flex-col items-center gap-3 md:gap-5 px-6 md:px-8 py-6 rounded-[1.5rem] bg-[#0c0c0c] border border-red-600 w-full max-w-[600px] justify-center shadow-[0_0_40px_rgba(255,0,0,0.4)] transform scale-95 transition-all duration-500 cursor-default text-center">
            <div class="flex flex-col md:flex-row items-center gap-3 md:gap-5 w-full justify-center">
                <span
                    class="text-xl md:text-3xl uppercase text-[#64748b] font-bold font-bebas tracking-widest pt-1">DESTINO:</span>
                <div id="lastNumberBadge"
                    class="px-4 md:px-8 py-3 md:py-4 rounded-2xl bg-[#2a0c0c] text-white font-bebas text-3xl md:text-4xl flex items-center justify-center border-2 border-red-500/80 drop-shadow-md w-full min-h-[60px] md:min-w-[200px]">
                    --
                </div>
            </div>
            <p id="resultDescription"
                class="text-gray-200 font-special-elite text-sm md:text-xl mt-4 md:mt-6 max-w-[550px] leading-relaxed drop-shadow-[0_2px_8px_rgba(255,0,0,0.8)] min-h-[80px]">
                --
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
